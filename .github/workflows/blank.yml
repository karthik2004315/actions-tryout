name: Build and Push

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 🔥 Backend
      - name: Build backend
        run: docker build -t karthik2354/backend:latest ./backend

      - name: Push backend
        run: docker push karthik2354/backend:latest

      # 🔥 Frontend
      - name: Build frontend
        run: docker build -t karthik2354/frontend:latest ./frontend

      - name: Push frontend
        run: docker push karthik2354/frontend:latest

      # 🔥 Nginx
      - name: Build nginx
        run: docker build -t karthik2354/nginx:latest ./nginx

      - name: Push nginx
        run: docker push karthik2354/nginx:latest
